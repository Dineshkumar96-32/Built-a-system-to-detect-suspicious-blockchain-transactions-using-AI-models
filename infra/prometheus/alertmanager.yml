global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.example.com:587'
  smtp_from: 'alerts@blockshield.io'
  smtp_auth_username: 'alerts@blockshield.io'
  smtp_auth_password: '${SMTP_PASSWORD}'

route:
  group_by: ['alertname', 'severity']
  group_wait:      30s
  group_interval:  5m
  repeat_interval: 4h
  receiver: default

  routes:
    - match:
        severity: critical
      receiver: critical
      repeat_interval: 30m

    - match:
        severity: warning
      receiver: default
      repeat_interval: 2h

receivers:
  - name: default
    email_configs:
      - to: 'analysts@blockshield.io'
        send_resolved: true
        headers:
          Subject: '[BlockShield] {{ .Status | toUpper }}: {{ .GroupLabels.alertname }}'

  - name: critical
    email_configs:
      - to: 'oncall@blockshield.io'
        send_resolved: true
        headers:
          Subject: '[CRITICAL] BlockShield: {{ .GroupLabels.alertname }}'
    # Uncomment and configure for Slack/PagerDuty:
    # slack_configs:
    #   - api_url: '${SLACK_WEBHOOK_URL}'
    #     channel: '#blockshield-alerts'
    #     title: '{{ .GroupLabels.alertname }}'
    #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']
