version: "3.9"

# ─────────────────────────────────────────────────────────────
# BlockShield — Full Production Stack
#
# Services:
#   app         FastAPI backend
#   worker      Background pipeline worker
#   postgres    Primary database
#   redis       Broker backend + rate-limiter
#   zookeeper   Kafka dependency
#   kafka       High-throughput broker
#   prometheus  Metrics scraper
#   grafana     Dashboard UI
#   alertmanager Prometheus alerting
# ─────────────────────────────────────────────────────────────

networks:
  blockshield:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:

x-app-env: &app-env
  DATABASE_URL:             postgresql+asyncpg://${POSTGRES_USER:-bs}:${POSTGRES_PASSWORD:-blockshield}@postgres:5432/${POSTGRES_DB:-blockshield}
  REDIS_URL:                redis://redis:6379/0
  BROKER_BACKEND:           ${BROKER_BACKEND:-redis}
  KAFKA_BOOTSTRAP_SERVERS:  kafka:9092
  JWT_SECRET_KEY:           ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set}
  LOG_JSON:                 "true"
  MODEL_DIR:                /app/models
  RETRAIN_THRESHOLD:        "50"
  RETRAIN_INTERVAL_SEC:     "3600"
  ETH_ALCHEMY_KEY:          ${ETH_ALCHEMY_KEY:-}
  ETH_INFURA_KEY:           ${ETH_INFURA_KEY:-}
  POLYGON_ALCHEMY_KEY:      ${POLYGON_ALCHEMY_KEY:-}

services:

  # ── FastAPI App ─────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: blockshield-app:latest
    container_name: blockshield_app
    restart: unless-stopped
    networks: [blockshield]
    ports:
      - "8000:8000"
    environment:
      <<: *app-env
      WORKERS: "4"
    volumes:
      - ./models:/app/models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  # ── Pipeline Worker ─────────────────────────────────────────
  worker:
    image: blockshield-app:latest
    container_name: blockshield_worker
    restart: unless-stopped
    networks: [blockshield]
    environment:
      <<: *app-env
    volumes:
      - ./models:/app/models
    depends_on:
      app:
        condition: service_healthy
    command: python -m app.worker

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: blockshield_postgres
    restart: unless-stopped
    networks: [blockshield]
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-bs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blockshield}
      POSTGRES_DB:       ${POSTGRES_DB:-blockshield}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: blockshield_redis
    restart: unless-stopped
    networks: [blockshield]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Zookeeper (Kafka dep) ───────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: blockshield_zookeeper
    restart: unless-stopped
    networks: [blockshield]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME:   2000
    volumes:
      - kafka_data:/var/lib/zookeeper

  # ── Kafka ───────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: blockshield_kafka
    restart: unless-stopped
    networks: [blockshield]
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID:                        1
      KAFKA_ZOOKEEPER_CONNECT:                zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS:             PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE:        "true"
      KAFKA_LOG_RETENTION_HOURS:              48
      KAFKA_MESSAGE_MAX_BYTES:                "5242880"
    depends_on: [zookeeper]
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── Prometheus ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: blockshield_prometheus
    restart: unless-stopped
    networks: [blockshield]
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    depends_on:
      app:
        condition: service_healthy

  # ── Grafana ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.3
    container_name: blockshield_grafana
    restart: unless-stopped
    networks: [blockshield]
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-blockshield_admin}
      GF_USERS_ALLOW_SIGN_UP:     "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/blockshield.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./backend/observability/grafana_dashboard.json:/var/lib/grafana/dashboards/blockshield.json:ro
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on: [prometheus]

  # ── Alertmanager ────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: blockshield_alertmanager
    restart: unless-stopped
    networks: [blockshield]
    ports:
      - "9093:9093"
    volumes:
      - ./infra/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
