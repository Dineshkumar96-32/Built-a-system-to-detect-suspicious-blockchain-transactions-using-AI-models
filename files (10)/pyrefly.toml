# pyrefly.toml
# ─────────────────────────────────────────────────────────────────────────────
# Pyrefly configuration for BlockShield.
# Docs: https://pyrefly.org/en/docs/configuration/
# Error kinds: https://pyrefly.org/en/docs/error-kinds/
#
# HOW TO RUN:
#   pip install pyrefly
#   pyrefly check
#
# ─────────────────────────────────────────────────────────────────────────────

[tool.pyrefly]

# ── Python interpreter ────────────────────────────────────────────────────────
# Point Pyrefly at the virtual-env interpreter so it can find installed packages
# (sqlalchemy, fastapi, etc.) and stop emitting missing-import errors.
#
# Windows:  python_interpreter = ".venv/Scripts/python.exe"
# macOS/Linux: python_interpreter = ".venv/bin/python"
#
# Uncomment and adjust to match your venv location:
# python_interpreter = ".venv/Scripts/python.exe"   # Windows
# python_interpreter = ".venv/bin/python"            # macOS / Linux

# ── Source search paths ───────────────────────────────────────────────────────
# Added to sys.path so Pyrefly resolves internal package imports.
# Fixes: "Cannot find module `app.core.database`" etc.
search_path = [
  ".",           # project root → resolves top-level packages: app, broker, ml, auth, observability
]

# ── Python version ────────────────────────────────────────────────────────────
python_version = "3.11"

# ── Which files to type-check ─────────────────────────────────────────────────
project_includes = [
  "app",
  "broker",
  "ml",
  "auth",
  "observability",
  "tests",
  "migrations",
]

project_excludes = [
  "**/__pycache__/**",
  "**/.venv/**",
  "**/node_modules/**",
  "migrations/versions/**",   # auto-generated Alembic scripts
]

# ── Per-module import suppression ─────────────────────────────────────────────
# NOTE: Pyrefly does NOT use `ignore_missing_imports` (that is mypy syntax).
# Instead, use `# pyrefly: ignore[missing-import]` inline, OR install the
# package + its stubs so Pyrefly can find them.
#
# For packages that have no stubs at all, suppress per-file using:
#   # pyrefly: ignore[missing-import]   ← at the top of the importing file
#
# The correct Pyrefly approach is:
#   1. Install the package in your venv (pip install -r requirements.txt)
#   2. Set python_interpreter above to point at that venv
#   3. Pyrefly will find the installed package and its bundled stubs

# ── Error severity overrides ──────────────────────────────────────────────────
# https://pyrefly.org/en/docs/error-kinds/
[tool.pyrefly.errors]

# ── Errors: fail CI ──────────────────────────────────────────
missing-attribute       = "error"
bad-argument-type       = "error"
bad-return              = "error"
unknown-name            = "error"
unbound-name            = "error"

# ── missing-import: warn not error ───────────────────────────
# Set to "warn" instead of "error" so optional deps (torch, aiokafka, etc.)
# don't break CI when they're intentionally absent.
# Individual call-sites use `# type: ignore[import]` for full suppression.
missing-import          = "warn"

# ── Warnings: surface in IDE, don't block CI ─────────────────
implicit-any            = "warn"
implicit-any-parameter  = "warn"
implicit-any-attribute  = "warn"
unannotated-return      = "warn"
untyped-import          = "warn"
deprecated              = "warn"
redundant-condition     = "warn"
non-exhaustive-match    = "warn"
unreachable             = "warn"

# ── Info / ignored ────────────────────────────────────────────
reveal-type                  = "info"
unused-ignore                = "ignore"
implicitly-defined-attribute = "ignore"
implicit-abstract-class      = "ignore"
missing-override-decorator   = "ignore"
not-required-key-access      = "ignore"
open-unpacking               = "ignore"
variance-mismatch            = "warn"
